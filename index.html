<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments">
      <li class="comment">
        <div class="comment-header">
          <div>Глеб Фокин</div>
          <div>12.02.22 12:18</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Это будет первый комментарий на этой странице
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">3</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
      <li class="comment">
        <div class="comment-header">
          <div>Варвара Н.</div>
          <div>13.02.22 19:22</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Мне нравится как оформлена эта страница! ❤
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">75</span>
            <button class="like-button -active-like"></button>
          </div>
        </div>
      </li>
    </ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";
  const commentBox = document.querySelector('.comments');
  function addComment({ name, date, text, likes = 0 }) {
    commentBox.innerHTML += `
      <li class="comment">
        <div class="comment-header">
          <div>${name}</div>
          <div>${date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">${text}</div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">${likes}</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
    `;
  }

  // Делегирование: один обработчик на весь список
  commentBox.addEventListener('click', (event) => {
    if (!event.target.matches('.like-button')) return;

    const btn = event.target; // объект события на котором произошел клик
    const counter = btn.closest('.likes').querySelector('.likes-counter');
    //Тут цепочка из двух методов. Читается справа налево: «от кнопки поднимись до .likes, а внутри найди .likes-counter».
    //Часть A: btn.closest('.likes')
    //closest идёт вверх по дереву(родитель → дед → прадед...) и возвращает первый элемент, подходящий под селектор.Начинает с самого btn, потом его родитель, и так далее.
    const isActive = btn.classList.toggle('-active-like');

    counter.textContent = Number(counter.textContent) + (isActive ? 1 : -1);
  });

  function escapeHtml(str) {
    return str
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  const button = document.querySelector('.add-form-button');
  const nameInput = document.querySelector('.add-form-name');
  const textInput = document.querySelector('.add-form-text');

  button.addEventListener('click', () => {
    addComment({
      name: escapeHtml(nameInput.value),
      date: new Date().toLocaleString(),
      text: escapeHtml(textInput.value),
      likes: 0,
    });

    nameInput.value = '';
    textInput.value = '';
  });

</script>

</html>
